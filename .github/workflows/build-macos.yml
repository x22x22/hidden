name: Build macOS App

on:
  push:
    branches:
      - main
      - develop
      - 'copilot/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer
      
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Build app
      run: |
        xcodebuild clean build \
          -project "Hidden Bar.xcodeproj" \
          -scheme "Hidden Bar" \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Create DMG
      run: |
        # Create a temporary directory for DMG contents
        mkdir -p dmg_contents
        
        # Copy the built app to the DMG directory
        cp -r "build/Build/Products/Release/Hidden Bar.app" dmg_contents/
        
        # Create Applications symlink
        ln -s /Applications dmg_contents/Applications
        
        # Create the DMG
        hdiutil create -volname "Hidden Bar" \
          -srcfolder dmg_contents \
          -ov -format UDZO \
          "Hidden-Bar.dmg"
    
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hidden-Bar-dmg
        path: Hidden-Bar.dmg
        retention-days: 30
    
    - name: Upload app bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: Hidden-Bar-app
        path: build/Build/Products/Release/Hidden Bar.app
        retention-days: 30
